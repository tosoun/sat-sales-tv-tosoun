<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Πωλήσεις 2026</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #2c3e50;
    }

    .frame-wrap {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #2c3e50;
    }

    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(100% + 70px);
      border: 0;
    }
  </style>
</head>

<body>

  <div class="frame-wrap">
    <iframe
      src="https://upload-tv-spame-tosoun.streamlit.app/?embed=true"
      allow="fullscreen">

  </div>

</body>
