<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no,
                 viewport-fit=cover">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Πωλήσεις">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#2c3e50">

  <title>Πωλήσεις</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #2c3e50;
      overflow: hidden;
    }

    .app-shell {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #2c3e50;
    }

    .app-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(100dvh + 72px);
      border: 0;
      display: block;
      background: #2c3e50;
    }
  </style>
</head>

<body>

  <div class="app-shell">
    <iframe
      class="app-frame"
      src="https://upload-tv-spame-tosoun.streamlit.app/?embed=true"
      scrolling="yes"
      allow="fullscreen">
    </iframe>
  </div>

</body>
</html>
