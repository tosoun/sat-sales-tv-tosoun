<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Πωλήσεις 2026</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #2c3e50;
      overflow: hidden;
    }

    .app-wrap {
      position: fixed;
      inset: 0;
      background: #2c3e50;
      overflow: hidden;
    }

    .app-frame {
      width: 100%;
      height: 100dvh;
      border: 0;
      display: block;
    }

    /* Καλύπτει μόνο την κάτω μπάρα του Streamlit */
    .streamlit-cover {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 64px;
      background: #2c3e50;
      z-index: 9999;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div class="app-wrap">
    <iframe
      class="app-frame"
      src="https://upload-tv-spame-tosoun.streamlit.app/?embed=true"
      scrolling="yes">
    </iframe>
  </div>

  <div class="streamlit-cover"></div>

</body>
</html>
